rse a shape."]},"start":"2026-10-08","end":"2026-12-23"}, INFO = [["The one rule","Hit protein and do the training. Everything else is adjustable."],["Targets","~1600 kcal/day average, cycled: hard days 1750-1800, gym days 1570-1650, rest days 1380-1450. Protein 135-145 g every single day."],["Fat is not the enemy here","You average 50 g fat a day, 0.74 g/kg bodyweight, 28% of calories. That is a normal, healthy range, not a low-fat diet. Dietary fat does not become body fat any faster than carbs do; the deficit is what drives fat loss. Do NOT cut fat further to save calories. Below about 20% of calories or 0.5 g/kg you risk hormones, cycle regularity and vitamin A/D/E/K absorption."],["If a day lands under 45 g fat","Add 10 almonds or 10 ml olive oil. Costs about 70-90 kcal. Take it off the rice, not off the protein."],["Sugar","Not tracked, on purpose. There is almost no added sugar in this plan: the sugar you get is lactose in milk and yogurt plus fruit, roughly 40-55 g a day, and it comes with protein, fibre and micronutrients. The three places added sugar sneaks in are the Saturday McDonald's, \u725b\u4e3c and teriyaki sauce, and \u829d\u9ebb\u9171 or sweet dressings on \u8f7b\u98df bowls. The ordering rules already handle all three."],["Accuracy caveat","Multiply the macros out at 4/4/9 and you get about 80 kcal less than the calorie figure shown. That is rounding stacked across five entries, and it errs on the generous side. Judge progress from the scale trend, never from the arithmetic."],["Steps","7500-10000 on top of training. This does more for fat loss than any single cardio session."],["Creatine","3 g every day in the PM shake, training or not. 3 g is enough at your bodyweight; the point is taking it daily without gaps, not the exact dose."],["Sleep","7-8 h. Under 6 h you lose more muscle and less fat."],["Weigh-ins","Mon, Wed, Fri, first thing, log them here. Judge the weekly average, never a single day."],["Back up your data","Log tab, Export my data. It copies a block of text. Keep it in Notes. Nothing here is stored anywhere but this phone, so that text is your only copy."],["Period days 1-3","Tap the period button on the Log tab on day 1. This screen then tells you the lighter session. No heavy lower body, no competing, no intervals. Food does not change."],["Water weight before your period","Expect +0.5 to 1.5 kg. Ignore it. Do not cut calories in response."],["Flat for 2 weeks","Add 1500 steps first. Only cut 100 kcal if it is still flat a week later."],["Losing faster than 0.8 kg/week","Too fast. Add 150 kcal of carbs to hard days."],["Strength down 2 sessions running","Eat ~2100 for 3 days, then resume. Usually sleep or carbs, not the plan."],["If you only get 3 sessions","Keep legs+hips, one upper day, CrossFit. Drop the runs. Never the leg day."],["Expected outcome","-4 to -5.5 kg over the 11 weeks, ~3.5-5 kg of it fat. Planned against your Garmin maintenance of 1970, not the higher equation estimate."]];
const LS = k => { try { return JSON.parse(localStorage.getItem("fp_"+k)) || {} } catch(e) { return {} } };
const SV = (k,v) => localStorage.setItem("fp_"+k, JSON.stringify(v));
let checks = LS("checks"), swaps = LS("swaps"), weights = LS("weights"), periods = LS("periods");
if (!Array.isArray(periods.list)) periods = {list:[], span:3};
let tab = 0, idx = 0;

const byDate = {}; DATA.days.forEach((x,i)=>byDate[x.d]=i);
function todayIdx(){
  const t = new Date(); t.setHours(12,0,0,0);
  const iso = t.toISOString().slice(0,10);
  if (byDate[iso] !== undefined) return byDate[iso];
  if (iso < DATA.start) return 0;
  return DATA.days.length-1;
}
idx = todayIdx();

function isLight(iso){
  const t = new Date(iso+"T12:00:00");
  for (const p of periods.list){
    const s = new Date(p+"T12:00:00");
    const diff = Math.round((t-s)/86400000);
    if (diff >= 0 && diff < (periods.span||3)) return diff+1;
  }
  return 0;
}
const opts = {bf:Object.keys(DATA.B).sort(), lu:Object.keys(DATA.L).sort(), din:Object.keys(DATA.D).sort()};
function pick(day, slot){
  const k = day.d+"_"+slot;
  return swaps[k] || day[slot];
}
function cycle(day, slot){
  const list = opts[slot], cur = pick(day, slot);
  const n = list[(list.indexOf(cur)+1) % list.length];
  swaps[day.d+"_"+slot] = n; SV("swaps", swaps); render();
}
function tog(id){ checks[id] = !checks[id]; SV("checks", checks); render(); }
function mv(n){ idx = Math.max(0, Math.min(DATA.days.length-1, idx+n)); tab = 0; render(); }
function go(n){ tab = n; render(); }

function mealRow(day, slot, code, bank, label){
  const m = bank[code], id = day.d+"_"+slot;
  const on = !!checks[id];
  const tw = (slot==='lu' && code===day.lu && day.tweak!=='no change')
    ? `<div class="sub" style="color:#ffd58a">Today: ${day.tweak}</div>` : '';
  return `<div class="row ${on?'done':''}">
    <button class="ck ${on?'on':''}" onclick="tog('${id}')"></button>
    <div class="body">
      <div class="ttl">${label}: ${m.n} <small class="dim">(${code})</small></div>
      <div class="sub">${m.t}</div>
      ${tw}
      <div class="meta">${m.kcal} kcal &middot; P ${m.p} &middot; C ${m.c} &middot; F ${m.f}</div>
      ${opts[slot]?`<button class="swap" onclick="cycle(DATA.days[${idx}],'${slot}')">swap option &#8635;</button>`:''}
    </div></div>`;
}

function viewToday(){
  const day = DATA.days[idx];
  const ld = isLight(day.d);
  const bf = pick(day,'bf'), lu = pick(day,'lu'), din = pick(day,'din');
  const sameLunch = (lu === day.lu);
  let kcal = DATA.B[bf].kcal + DATA.L[lu].kcal + DATA.PM.kcal + DATA.D[din].kcal + (sameLunch ? day.adjk : 0);
  let prot = DATA.B[bf].p + DATA.L[lu].p + DATA.PM.p + DATA.D[din].p;
  let fat  = DATA.B[bf].f + DATA.L[lu].f + DATA.PM.f + DATA.D[din].f;
  let carb = DATA.B[bf].c + DATA.L[lu].c + DATA.PM.c + DATA.D[din].c + (sameLunch ? Math.round(day.adjk/4) : 0);
  day.sn.forEach(s=>{ kcal += DATA.S[s].kcal; prot += DATA.S[s].p; fat += DATA.S[s].f; carb += DATA.S[s].c; });
  let h = "";
  if (ld) h += `<div class="alert"><b>Period day ${ld} of ${periods.span||3} - light day</b>${day.light}</div>`;
  h += `<div class="tbar">
    <div><b>${day.kcal}</b><span>kcal target</span></div>
    <div><b>${kcal}</b><span>menu total</span></div>
    <div><b>${prot}</b><span>protein g</span></div>
    <div><b>${fat}</b><span>fat g</span></div>
    <div><b>${carb}</b><span>carb g</span></div>
  </div>`;
  const gap = kcal - day.kcal;
  if (Math.abs(gap) <= 40) h += `<div class="card"><div class="row"><div class="body"><div class="ttl" style="color:#a8e0bb">Menu matches target</div><div class="sub">Eat the list as written and you land on ${day.kcal} kcal. Nothing to calculate.</div></div></div></div>`;
  else if (gap > 40) h += `<div class="card"><div class="row"><div class="body"><div class="ttl" style="color:#ffd58a">Runs about ${gap} kcal over</div><div class="sub">${sameLunch ? 'Even the smallest lunch overshoots today. Either make the PM shake with water instead of milk (-105), or let it ride: this happens 3 days out of 77 and is smaller than the error bar on any of these numbers.' : 'You swapped the lunch, so the portion tweak below no longer applies. Either go back to '+day.lu+', or take '+Math.round(gap/1.3)+' g of rice off this one.'}</div></div></div></div>`;
  else h += `<div class="card"><div class="row"><div class="body"><div class="ttl" style="color:#a8e0bb">Room for about ${-gap} kcal more</div><div class="sub">Add ${Math.round(-gap/1.3)} g more cooked rice at lunch, or the evening yogurt (S5). Do not under-eat on a hard day.</div></div></div></div>`;
  const tid = day.d+"_train", ton = !!checks[tid];
  h += `<div class="card"><h3>Training</h3>
    <div class="row ${ton?'done':''}">
      <button class="ck ${ton?'on':''}" onclick="tog('${tid}')"></button>
      <div class="body"><div class="ttl">${ld?'<s>'+day.label+'</s>':day.label}</div>
      <div class="meta">${day.alt}</div></div>
    </div>
    <div class="ex">${(DATA.TRAIN[day.tkey]||[]).map(x=>`<div>${x}</div>`).join("")}</div>
    ${day.dl?'<div class="ex" style="color:#ffe6a8">DELOAD WEEK: one less set on every exercise, load down 10%.</div>':''}
  </div>`;
  h += `<div class="card"><h3>Food</h3>
    ${mealRow(day,'bf',bf,DATA.B,'Breakfast')}
    ${mealRow(day,'lu',lu,DATA.L,'Lunch')}
    ${mealRow(day,'pm','PM',{PM:DATA.PM},'Afternoon')}
    ${mealRow(day,'din',din,DATA.D,'Dinner')}
  </div>`;
  h += `<div class="card"><h3>Snacks &amp; extras</h3>` +
    day.sn.map(s=>mealRow(day,'sn_'+s,s,DATA.S,'Snack')).join("") +
    `<div class="row"><div class="body"><div class="sub">Steps target 7500-10000. Water 2.5-3 L.</div></div></div></div>`;
  return h;
}

function viewWeek(){
  const day = DATA.days[idx];
  const wk = DATA.days.filter(x=>x.wk===day.wk);
  let h = `<div class="card"><h3>Week ${day.wk} &middot; ${day.blk}</h3>`;
  wk.forEach(x=>{
    const i = byDate[x.d], ld = isLight(x.d);
    h += `<div class="wk ${x.d===day.d?'today':''}" onclick="idx=${i};tab=0;render()">
      <div class="dd">${x.nice.slice(0,6)}</div>
      <div class="tt">${ld?'<span style="color:#ff9fbb">[light] </span>':''}${x.label}</div>
      <div class="b ${x.type}">${x.kcal}</div></div>`;
  });
  h += `</div><div class="card"><h3>Jump</h3>
    <div class="row"><div class="body">
    <input type="date" min="${DATA.start}" max="${DATA.end}" value="${day.d}"
      onchange="if(byDate[this.value]!==undefined){idx=byDate[this.value];tab=0;render()}">
    <div style="height:8px"></div>
    <button class="btn ghost" onclick="idx=todayIdx();tab=0;render()">Back to today</button>
    </div></div></div>`;
  return h;
}

function logWeight(){
  const el = document.getElementById("wi");
  const v = parseFloat(el.value);
  if (!v) return;
  weights[DATA.days[idx].d] = v; SV("weights", weights); render();
}
function addPeriod(){
  const iso = DATA.days[idx].d;
  if (!periods.list.includes(iso)) periods.list.push(iso);
  periods.list.sort(); SV("periods", periods); render();
}
function delPeriod(iso){
  periods.list = periods.list.filter(x=>x!==iso); SV("periods", periods); render();
}
function setSpan(v){ periods.span = Math.max(1, Math.min(6, parseInt(v)||3)); SV("periods", periods); render(); }

function exportData(){
  const blob = JSON.stringify({v:1, when:new Date().toISOString(), checks, swaps, weights, periods});
  const ta = document.getElementById("io");
  ta.value = blob; ta.style.display = "block"; ta.select();
  let msg = "Copied. Paste it into Notes or email it to yourself.";
  try { navigator.clipboard.writeText(blob); } catch(e){ msg = "Select all the text below and copy it."; }
  document.getElementById("iomsg").textContent = msg;
  if (navigator.share) { try { navigator.share({title:"Plan backup", text:blob}); } catch(e){} }
}
function showImport(){
  const ta = document.getElementById("io");
  ta.value = ""; ta.style.display = "block"; ta.placeholder = "Paste your backup text here, then tap Restore again";
  ta.focus();
  document.getElementById("iomsg").textContent = "Paste the backup, then tap Restore from backup once more.";
  window.__importArmed = true;
}
function importData(){
  const ta = document.getElementById("io");
  if (!window.__importArmed || !ta.value.trim()) { showImport(); return; }
  let o;
  try { o = JSON.parse(ta.value.trim()); } catch(e){
    document.getElementById("iomsg").textContent = "That is not valid backup text. Nothing was changed."; return;
  }
  if (!o || typeof o !== "object" || !("weights" in o || "checks" in o)) {
    document.getElementById("iomsg").textContent = "That text is not a plan backup. Nothing was changed."; return;
  }
  const n = Object.keys(o.weights||{}).length;
  if (!confirm("Restore backup from " + (o.when||"unknown date").slice(0,10) + "?\n" + n + " weigh-ins. This replaces what is on this phone.")) return;
  checks = o.checks||{}; swaps = o.swaps||{}; weights = o.weights||{};
  periods = (o.periods && Array.isArray(o.periods.list)) ? o.periods : {list:[],span:3};
  SV("checks",checks); SV("swaps",swaps); SV("weights",weights); SV("periods",periods);
  window.__importArmed = false;
  render();
  const m = document.getElementById("iomsg");
  if (m) m.textContent = "Restored " + n + " weigh-ins, " + (periods.list.length) + " period dates and your tick marks.";
}
function viewLog(){
  const day = DATA.days[idx];
  const ks = Object.keys(weights).sort().reverse();
  const last7 = ks.slice(0,7).map(k=>weights[k]);
  const avg = last7.length ? (last7.reduce((a,b)=>a+b,0)/last7.length).toFixed(2) : "-";
  const first = ks.length ? weights[ks[ks.length-1]] : null;
  const chg = (first && last7.length) ? ((last7.reduce((a,b)=>a+b,0)/last7.length) - first).toFixed(2) : "-";
  let h = `<div class="tbar">
    <div><b>${avg}</b><span>last-7 avg kg</span></div>
    <div><b>${chg}</b><span>change vs start</span></div>
    <div><b>${ks.length}</b><span>weigh-ins</span></div></div>`;
  h += `<div class="card"><h3>Weight for ${day.nice}</h3><div class="row"><div class="body">
    <input id="wi" type="number" step="0.05" placeholder="kg" value="${weights[day.d]||''}">
    <div style="height:8px"></div>
    <button class="btn" onclick="logWeight()">Save weigh-in</button>
    <div class="meta">Mon / Wed / Fri, first thing, after the toilet, before food.</div>
    </div></div></div>`;
  h += `<div class="card"><h3>Period tracker</h3><div class="row"><div class="body">
    <button class="btn warn" onclick="addPeriod()">My period started on ${day.nice}</button>
    <div class="meta">This marks ${day.nice} as day 1. The next ${periods.span||3} days switch to light training automatically.</div>
    <div style="height:10px"></div>
    <small class="dim">Light days per period</small>
    <input type="number" min="1" max="6" value="${periods.span||3}" onchange="setSpan(this.value)">
    </div></div>`;
  if (periods.list.length){
    h += `<div class="lst">` + periods.list.slice().reverse().map(p=>{
      const n = DATA.days[byDate[p]] ? DATA.days[byDate[p]].nice : p;
      return `<div><span>${n}</span><span onclick="delPeriod('${p}')" style="color:#ff9fbb">remove</span></div>`;
    }).join("") + `</div>`;
  }
  h += `</div>`;
  if (ks.length){
    h += `<div class="card"><h3>Weigh-in history</h3><div class="lst">` +
      ks.map(k=>`<div><span>${DATA.days[byDate[k]]?DATA.days[byDate[k]].nice:k}</span><b>${weights[k]} kg</b></div>`).join("") +
      `</div></div>`;
  }
  h += `<div class="card"><h3>Backup</h3><div class="row"><div class="body">
    <div class="sub">Your data lives only on this phone. Export it now and again every few weeks, so a cleared browser or a new phone does not lose three months of logging.</div>
    <div style="height:9px"></div>
    <button class="btn ghost" onclick="exportData()">Export my data</button>
    <div style="height:7px"></div>
    <button class="btn ghost" onclick="importData()">Restore from backup</button>
    <div class="meta" id="iomsg"></div>
    <textarea id="io" style="display:none;width:100%;height:110px;margin-top:9px;background:#232a32;border:1px solid #333c46;color:#e8eaed;border-radius:10px;padding:10px;font-size:12px;font-family:monospace"></textarea>
    </div></div></div>`;
  h += `<div class="card"><h3>Reset</h3><div class="row"><div class="body">
    <button class="btn ghost" onclick="if(confirm('Clear all ticks only?')){checks={};SV('checks',checks);render()}">Clear all tick marks</button>
    </div></div></div>`;
  return h;
}

function viewInfo(){
  let h = `<div class="card"><h3>How to use this</h3><div class="ex">
    <div>Tick things off as you go. It saves on this phone only.</div>
    <div>Tap "swap option" on any meal to cycle to another one of the same type.</div>
    <div>On day 1 of your period, open the Log tab and tap the red button. Today, Week and the training card all switch to light versions.</div>
    <div>Arrows at the top move a day. Week tab has a date jump.</div>
  </div></div>`;
  h += `<div class="card"><h3>The rules</h3>` +
    INFO.map(([a,b])=>`<div class="row"><div class="body"><div class="ttl">${a}</div><div class="sub">${b}</div></div></div>`).join("") +
    `</div>`;
  h += `<div class="card"><h3>Meal bank</h3>`;
  [["Breakfast","B"],["Lunch","L"],["Dinner","D"],["Snacks","S"]].forEach(([t,k])=>{
    h += `<div class="ex"><div style="color:#6fb5ff">${t}</div>` +
      Object.keys(DATA[k]).sort().map(c=>`<div><b>${c}</b> ${DATA[k][c].n} - ${DATA[k][c].kcal} kcal, P ${DATA[k][c].p}<br><small class="dim">${DATA[k][c].t}</small></div>`).join("") +
      `</div>`;
  });
  h += `</div>`;
  return h;
}

function render(){
  const day = DATA.days[idx], ld = isLight(day.d);
  document.getElementById("hd").textContent = day.nice;
  document.getElementById("hs").textContent = day.blk + " \u00b7 week " + day.wk;
  const t = {H:"Hard day", M:"Moderate", R:"Rest / walk"}[day.type];
  document.getElementById("bg").innerHTML =
    `<span class="b ${day.type}">${t}</span><span class="b">${day.kcal} kcal</span><span class="b">P 140 g</span>` +
    (day.dl?`<span class="b dl">Deload</span>`:``) +
    (ld?`<span class="b" style="background:#5a2438;color:#ffc9d8">Period day ${ld}</span>`:``);
  document.getElementById("v").innerHTML = [viewToday, viewWeek, viewLog, viewInfo][tab]();
  for (let i=0;i<4;i++) document.getElementById("t"+i).className = (i===tab?"on":"");
  window.scrollTo(0,0);
}
let sx=null;
document.addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
document.addEventListener("touchend",e=>{
  if(sx===null||tab!==0)return;
  const dx=e.changedTouches[0].clientX-sx;
  if(Math.abs(dx)>70) mv(dx<0?1:-1);
  sx=null;
},{passive:true});
render();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
</body></html>
